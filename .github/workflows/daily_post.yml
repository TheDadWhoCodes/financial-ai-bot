name: Daily Threads Market Post

on:
  schedule:
    # 7:00 AM PST (14:00 UTC)
    - cron: '30 14 * * *'
    # 1:30 PM PST (20:30 UTC)
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  run-poster:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Threads Poster Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python threads_poster.py